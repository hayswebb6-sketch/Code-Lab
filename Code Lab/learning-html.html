<!--The DOCTYPE html tells the site that it is an HTML document-->
<!DOCTYPE html>
<!-- The <html> tag is the root element of an HTML page and contains all other HTML elements like <head> and <body> -->
<html>
    <!-- The <head> section contains meta information about the document, like the title and links to external resources -->
    <head> 
    <!-- The <link> tag is used to link external resources, in this case, a CSS file -->
    <link rel="stylesheet" type="text/css" href="Learning_css.css">
    </head>
    <!-- The <body> section contains the content of the web page, like text, images, and other media -->
        <body> 
            <!-- The <div> tag is a container used to group together HTML elements -->
            <div>
                <!-- The <h1> tag defines a large heading -->
                <h1>V 1.0</h1>
                <!-- The <a> tag defines a hyperlink -->
                <!-- The <button> tag defines a clickable button -->
                <a href="Code_lab.exe" download>
                <button>
                    Download
                </button>
                </a>
                <!-- The <p> tag defines a paragraph -->
                <p>*This will recive frequent updates, so you may have to download this again frequently*</p>
            </div>
        </body>
</html>
<!-- Everything in HTML is closed with </tag> Example: <div></div> -->
<!-- This is a comment in HTML(Weird) -->
